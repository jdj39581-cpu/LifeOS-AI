name: lifeos_ai
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  animated_text_kit: ^4.2.2
  lottie: ^3.1.2
  geolocator: ^11.0.0
  local_auth: ^2.3.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  file_picker: ^10.3.2
  http: ^1.5.0
  flutter_tts: ^4.0.2
  provider: ^6.1.5
  table_calendar: ^3.1.2
  open_filex: ^4.7.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  shared_preferences: ^2.5.5
  pdf: ^3.11.1
  path_provider: ^2.1.4
  printing: ^5.13.4

  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  image_path: assets/icon/lifeos_icon.jpg.jpeg
